# Shared substrate for BOTH appliance modes — Me (docker-compose-me.yml) and
# Worlds (docker-compose-worlds.yml). Never `docker compose up` this file directly;
# the mode files include: it. Everything here is mode-agnostic: the graph, the
# local embedding model, document conversion, the sandbox pre-pull, and metrics.
#
# One EMBABEL_VERSION moves every Embabel image AND both modes together: a shared
# graph only stays coherent if schema migrations and the embedding model can never
# diverge between the processes writing to it.
#
# PULL-ONLY BY DESIGN — see the note in docker-compose.yml.

# CONTAINER LOGS ARE CAPPED. Docker's json-file driver keeps a container's stdout
# forever unless told otherwise, and the daemon default on Docker Desktop and a stock
# Engine is "otherwise" — so a chatty or crash-looping service grows its log until the
# VM disk is full, and the first symptom is some unrelated write failing. 3 x 50 MB
# per container is enough to read back through an incident; `embabel bugreport` takes
# what is there. Repeated per file because a YAML anchor does not cross an include.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ── Knowledge graph ─────────────────────────────────────────────────────────
  # ONE graph, shared by both modes deliberately: in the superset design the world
  # store IS the product's data plane, and the modes are two surfaces over it.
  neo4j:
    # The version is pinned in .env (embabel_setup/pins.py), because it is the version
    # that writes the graph's files: a newer Neo4j migrates them and an older one cannot
    # read them. The fallback is what every install ran before that line existed, and stays.
    image: neo4j:${NEO4J_VERSION:-2026.06-community}
    logging: *logging
    # NO container_name — deliberately. A fixed name is global to the docker
    # daemon, so a second instance could not start; compose names containers
    # <project>-<service>-N, which is per-instance for free. Find a container by
    # its compose labels (setup.py does), never by a name you wrote down.
    restart: unless-stopped
    # Sized by `embabel up` from Docker's memory (embabel_setup/memory.py, #111), with
    # the heap and page cache below derived from it. 0 — no limit — is what a hand-run
    # `docker compose up` gets, which is how the appliance ran before sizing existed.
    mem_limit: ${NEO4J_MEM_LIMIT:-0}
    ports:
      - "127.0.0.1:${NEO4J_BROWSER_PORT:-11045}:7474"   # browser
      - "127.0.0.1:${NEO4J_BOLT_PORT:-11046}:7687"      # bolt, for cypher-shell
    environment:
      # Same zone as the modes (setup.py writes TZ to .env): cypher's datetime()
      # and the graph's logs should tell the same time the assistant does.
      - TZ=${TZ:-Etc/UTC}
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-embabel-assistant}
      # Advertise the HOST-published Bolt port. The browser on the host port runs in the
      # user's browser and connects over Bolt from the host, and it pre-fills its
      # connect form from this value — without it the form offers the in-container
      # default :7687, which nothing on the host listens on, and the login fails
      # before credentials are even checked. The app services are unaffected: they
      # dial neo4j:7687 directly over the compose network.
      - NEO4J_server_bolt_advertised__address=localhost:${NEO4J_BOLT_PORT:-11046}
      # APOC only: the server uses apoc.refactor.mergeNodes for entity merging.
      # Graph Data Science was installed but never called — dropping it saves
      # the plugin download and its startup cost on every fresh boot.
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP:-2G}
      # Named rather than left to Neo4j, which sizes it from the memory it can SEE —
      # the whole VM, not this container's limit.
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-512M}
    healthcheck:
      # The app's Drivine pool connects during startup; without this gate it
      # races Neo4j's plugin load and the first boot fails on a fresh volume.
      #
      # The password is read out of NEO4J_AUTH because that is the only place this
      # container has it. `$$` leaves the expansion to the container's shell, and
      # NEO4J_PASSWORD is a variable of the HOST: compose puts it into NEO4J_AUTH
      # above and nowhere else. Asking for it here always fell back to the default,
      # so an install with a password of its own created the database with one
      # password and knocked with another, and never came up healthy. It cannot be
      # passed in under its own name either: the image reads every NEO4J_* variable
      # as a setting.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - embabel_appliance_neo4j_data:/data

  # ── Document conversion (PDF/DOCX/PPTX/XLSX → structured markdown) ──────────
  # Large image. Set ASSISTANT_DOC_CONVERTER=none in .env and `--scale docling=0`
  # if you only ever ingest text.
  #
  # MIRRORED to GHCR and pinned — verified present before this line was changed.
  # Upstream quay.io was the third registry a first run had to reach, and the one
  # people actually failed on ("TLS handshake timeout" mid-pull of a multi-GB
  # image). Every image the appliance needs now comes from one registry we control.
  # Upstream is MIT; the mirror is a byte-for-byte multi-arch copy refreshed by
  # .github/workflows/mirror-docling.yml. To adopt a new version OR a new variant:
  # run that workflow, confirm `docker manifest inspect ghcr.io/embabel/<image>:<tag>`
  # succeeds, THEN bump the default here. Never the other way round.
  #
  # THE CPU BUILD, DELIBERATELY. The stock docling-serve image carries a CUDA
  # PyTorch — torch 2.13+cu130, 2.9GB of nvidia/ libraries, 652MB of triton — that
  # nothing in this repo can reach: no compose file here reserves a GPU device, and
  # Docker gives a container no GPU unless one is asked for. So every host,
  # INCLUDING one with a real card, downloaded 5.00GB of CUDA and then ran on the
  # CPU anyway. The cpu tag is the same version and the same behaviour at 2.06GB
  # (arm64) — nearly 3GB off a first run, in exchange for nothing.
  #
  # A GPU host is a real case, and this does not serve it. Serving it needs the
  # CUDA image AND a device reservation, together — one without the other is what
  # we already had.
  #
  # DOCLING_IMAGE=docling-serve names the fat build, but nothing is mirrored under
  # that name in this org yet, so run mirror-docling for it first. It is not a
  # fallback you can reach for mid-incident; it is a thing to publish deliberately
  # if a reason to prefer it ever appears.
  docling:
    #
    # embabel-worlds, NOT embabel: a package belongs in the org of the repo that
    # publishes it. mirror-docling runs here, so pushing to embabel was cross-org
    # and its GITHUB_TOKEN had no rights there. Mirrored into this org the workflow
    # owns the package outright, and its Verify step now checks the pull a STRANGER
    # makes — a new GHCR package is created private, and an authenticated check
    # passes happily against an image nobody else can fetch.
    image: ghcr.io/embabel-worlds/${DOCLING_IMAGE:-docling-serve-cpu}:${DOCLING_VERSION:-v1.29.0}
    logging: *logging
    restart: unless-stopped
    # Conversion memory is bounded by the LARGEST single document, not corpus size:
    # one 10-K-sized PDF was measured pushing docling past 6GB (2026-08-13, dev).
    # Uncapped, it competes with neo4j and the app JVM (MaxRAMPercentage=45) for the
    # whole host and the OOM killer picks a victim at random — capped, an OOM stays
    # inside docling and `restart: unless-stopped` brings it back for the next
    # document. The app treats a mid-conversion death as a failed conversion (logged
    # at ERROR; strict-conversion mode fails the ingest instead of falling back to
    # flat Tika text). Raise on hosts that routinely convert very large filings.
    #
    # `embabel up` sizes this from Docker's memory alongside the app and the graph
    # (#111): 8g was more than a typical Docker Desktop VM has in total, so it was
    # never a limit at all. The 8g default remains for a hand-run compose.
    mem_limit: ${DOCLING_MEM_LIMIT:-8g}
    environment:
      - DOCLING_SERVE_ENABLE_UI=0
      # Each worker loads its own models and converts its own document, so the limit
      # above must hold every worker at its peak together. `embabel up` derives the count
      # from the limit (one below 7 GiB) and gives the app the same number, so it never
      # sends more at once (embabel/me#1730). 2 is docling's default, for a hand-run compose.
      - DOCLING_SERVE_ENG_LOC_NUM_WORKERS=${DOCLING_WORKERS:-2}

  # ── Code sandbox image, pre-pulled ──────────────────────────────────────────
  # Not a running service: a one-shot that exists so `docker compose up` pulls the
  # sandbox image onto the host daemon up front. Without it the first code-mode
  # call in a chat blocks on a multi-GB pull and reads as a hang. The tag MUST
  # match WorldConfig.DEFAULT_SANDBOX_IMAGE — that is the name the app asks the
  # daemon for (overridable per world via `sandboxDockerimage` in its config.yml).
  # On GHCR like every other Embabel image — the old unqualified name pointed at a
  # Docker Hub repository that was never public, so first pull failed for everyone.
  # OVERRIDABLE, and by the same name the app reads. The shipped image carries the
  # runtimes code-mode executes and nothing else; an operator who needs a JDK, Prolog
  # or their own compiler builds an image and names it here rather than making every
  # install download it. Set EMBABEL_SANDBOX_IMAGE in .env and both this pre-pull and
  # the container the app launches follow it — a single world can still override it
  # further with `sandboxDockerimage` in its config/world.yml.
  sandbox-image:
    image: ${EMBABEL_SANDBOX_IMAGE:-ghcr.io/embabel/assistant-sandbox:latest}
    restart: "no"
    command: ["true"]

  # ── Metrics ─────────────────────────────────────────────────────────────────
  # Prometheus scrapes each mode's /actuator/prometheus; Grafana renders it.
  #
  #   open http://localhost:11047       (no login, lands on Surface Health)
  #
  # OFF BY DEFAULT, behind the `monitoring` profile (embabel-worlds/appliance#112).
  # Always-on, they held back 768 MiB of a small machine's memory for dashboards most
  # people never open, while docling could not convert a scanned PDF in what was left.
  # `EMBABEL_MONITORING=on` in .env turns them on: `embabel up` adds the profile to the
  # environment compose runs with and reserves their memory in the split (#111).
  #
  # (They were profile-gated once before, and a fresh install silently had none while
  # the docs promised dashboards. The fix for that is docs that say they are off, and a
  # surfaces line that says how to turn them on — which is what there is now.)
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.1.0
    logging: *logging
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-0}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-11048}:9090"
    configs:
      # Inline content, not a bind mount — see the pull-only note in
      # docker-compose.yml. There is no prometheus.yml on your disk to lose.
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - embabel_appliance_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"

  grafana:
    profiles: ["monitoring"]
    # Stock Grafana with the Embabel dashboards baked in, because a pull-only
    # appliance has no directory to mount them from. Moves with EMBABEL_VERSION so
    # the dashboards match the metrics the app of that version actually emits.
    image: ghcr.io/embabel/assistant-grafana:${EMBABEL_VERSION:-latest}
    logging: *logging
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-0}
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-11047}:3000"
    environment:
      # No login wall. Consistent with the rest of the appliance, this is safe only
      # because the port binds to 127.0.0.1 — anyone who can reach it is admin.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
      # Land on Surface Health instead of an empty home. Path is the baked image
      # layer, not /var/lib/grafana — the volume below would shadow that.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/embabel-dashboards/embabel-overview.json
      - GF_FEATURE_TOGGLES_ENABLE=newDashboardSharingComponent
    volumes:
      # Grafana's own state (annotations, starred dashboards, its sqlite db). The
      # dashboards themselves are in the image, so this holds nothing you authored.
      - embabel_appliance_grafana_data:/var/lib/grafana

configs:
  # Scrape targets are the modes ON THE COMPOSE NETWORK — service name and the
  # in-container port, which SERVER_PORT keeps equal to the published one. Both
  # modes are listed; Prometheus treats an absent mode as a down target, which is
  # benign and honest — the Surface Health dashboard shows exactly what is running.
  prometheus_config:
    content: |
      global:
        scrape_interval: 10s
        evaluation_interval: 10s

      scrape_configs:
        - job_name: embabel-assistant
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["assistant:${ASSISTANT_PORT:-11042}"]
              labels:
                application: embabel-assistant
        - job_name: embabel-worlds
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["worlds:${WORLDS_PORT:-11043}"]
              labels:
                application: embabel-worlds

# ── Local embedding model: NOT HERE ───────────────────────────────────────────
# It lives in embeddings-local.yml, composed in only when somebody chooses it with
# `embabel embeddings use local`.
#
# It used to sit here, which meant every install downloaded ~1.1GB before anybody had
# uploaded a document, and required Docker Model Runner — a Docker Desktop feature, so
# on plain Docker Engine `docker model` is not a command and `docker compose up` failed
# on a dependency most users never needed.
#
# An appliance now starts with no embedding model. Document features report themselves
# off, with the command that turns them on, and nothing else is affected.

volumes:
  # Worlds on disk — documents, artifacts, apps, credentials. Shared by both
  # modes: a world is the unit the whole product family agrees on.
  embabel_assistant_data:
  embabel_appliance_neo4j_data:
  embabel_appliance_prometheus_data:
  embabel_appliance_grafana_data:
