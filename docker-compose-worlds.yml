# Embabel Worlds — the world-runtime mode of the appliance.
#
#   ./worlds.py                 # or: docker compose -f docker-compose-worlds.yml up -d
#   open http://localhost:11044  # THE CONSOLE — start here.
#                                # 11043 is the server: API and MCP, not a place to look.
#
# THE SAME IMAGE, THE SAME DATA as the Me mode (docker-compose-me.yml) — this is
# the superset design: the world runtime is always in the product, and this mode
# frames it as a headless-leaning team server (MCP, automations, webhooks, the
# data plane) on the 43xx block. There is no stripped-down build and no special
# Spring profile; what differs is the port, the name, and the packaging label.
#
# RUN ONE MODE AT A TIME against the shared store. Both modes up simultaneously
# means two identical JVMs each running the singleton background work — cron
# firing twice, channel autostart connecting the same Telegram bot token twice
# (an API conflict, not just waste), warmers and sweeps duplicated. If a genuine
# both-at-once deployment ever matters, that is the moment a "this instance does
# not schedule" switch earns its way into the app; until then, one mode.

name: embabel-appliance

include:
  - infra.yml

# CONTAINER LOGS ARE CAPPED. Docker's json-file driver keeps a container's stdout
# forever unless told otherwise, and the daemon default on Docker Desktop and a stock
# Engine is "otherwise" — so a chatty or crash-looping service grows its log until the
# VM disk is full, and the first symptom is some unrelated write failing. 3 x 50 MB
# per container is enough to read back through an incident; `embabel bugreport` takes
# what is there. Repeated per file because a YAML anchor does not cross an include.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ── The world runtime ───────────────────────────────────────────────────────
  worlds:
    image: ghcr.io/embabel/assistant:${EMBABEL_VERSION:-latest}
    logging: *logging
    # NO container_name — deliberately. A fixed name is global to the docker
    # daemon, so a second instance could not start; compose names containers
    # <project>-<service>-N, which is per-instance for free. Find a container by
    # its compose labels (setup.py does), never by a name you wrote down.
    restart: unless-stopped
    # NOT PID 1, so the watchdog below can end a wedged JVM: PID 1 ignores a SIGKILL sent
    # from inside its own container. Docker's own init runs first and reaps orphans too.
    init: true
    # The image's healthcheck, with a watchdog in it (container/health-watchdog.sh): Docker
    # only LABELS a container unhealthy, so a JVM that stops answering without exiting was
    # left up until somebody restarted it by hand. Same probe, interval and start period
    # as the image's own.
    healthcheck:
      test: ["CMD", "sh", "/opt/embabel/health-watchdog.sh"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 10
    # Sized by `embabel up` from Docker's memory (#111); no limit on a hand-run compose.
    mem_limit: ${APP_MEM_LIMIT:-0}
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      # Same host-equals-container port rule as the Me mode: the code sandbox is
      # handed host.docker.internal:${server.port}, so the two move together.
      - "127.0.0.1:${WORLDS_PORT:-11043}:${WORLDS_PORT:-11043}"
    # Realm credentials, without a compose edit per realm. A realm names the key it
    # needs (`token-env:` in its apis.yml) and you put that key in secrets.env, beside
    # this file — every line of it enters the container as-is. The alternative was a
    # named passthrough line here for each realm anyone ever installs, which is how a
    # committed file grows a list of everybody's integrations. Optional and gitignored;
    # see secrets.env.example. Anything under `environment:` below still wins.
    env_file:
      - path: secrets.env
        required: false
    environment:
      - SERVER_PORT=${WORLDS_PORT:-11043}
      # TWO MCP DOORS from the one server, named for their SURFACES:
      #
      #   /mcp  (also /mcp/chat)  embabel-chat  a chat client — Cowork, Desktop —
      #                                         sees the user's data tools, nothing else
      #   /mcp/code               embabel-code  a coding agent sees the building surface:
      #                                         realms, authoring, mining
      #
      # One JVM, one graph, two tool lists. No SPRING_AI_MCP_SERVER_NAME here on
      # purpose: the doors used to be named for the PRODUCTS, so this file had to
      # tell the image which one it was packaged as — and a client's server list
      # then showed `embabel-me` beside `embabel-worlds` on a single install. The
      # surfaces are the same whichever product you bought, so the server names
      # them and the packaging says nothing.
      - ASSISTANT_INFRASTRUCTURE_MCP_DEVELOPER_ENDPOINT_ENABLED=true
      # Host timezone, from .env (setup.py writes it) — see the Me mode's note.
      - TZ=${TZ:-Etc/UTC}
      # The appliance's engine is a SET default, not an inherited one: the app
      # image now defaults to its in-process engine when GRAPH_TYPE is absent
      # (embabel/me#1061), and an appliance composition must not change engines
      # because the app's default moved. NEO4J unless .env says otherwise; the
      # graph-memory/falkordb overlays override this explicitly.
      - GRAPH_TYPE=${GRAPH_TYPE:-NEO4J}
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-embabel-assistant}
      - NEO4J_BROWSER_PORT=${NEO4J_BROWSER_PORT:-11045}
      # Which appliance this server belongs to, stamped onto every code-sandbox
      # container it creates (JvmInstance.INSTANCE_LABEL_KEY). Sandboxes are
      # siblings created through the docker socket, not compose services, so
      # this label is the ONLY thing that tells one appliance's sandboxes from
      # another's — without it `embabel prune` on a machine with two appliances
      # removes live sessions belonging to the other one.
      - EMBABEL_INSTANCE=${EMBABEL_INSTANCE:-appliance}
      - ASSISTANT_PUBLIC_BASE_URL=${WORLDS_PUBLIC_BASE_URL:-http://localhost:${WORLDS_PORT:-11043}}
      # Where people open the console, so a request an agent raises in a conversation held elsewhere
      # (an OpenAI client) links to its Approvals window.
      - ASSISTANT_CONSOLE_URL=${WORLDS_CONSOLE_PUBLIC_URL:-http://localhost:${WORLDS_CONSOLE_PORT:-11044}}
      # The code-mode sandbox image, so the app launches whatever the pre-pull in
      # infra.yml fetched. Blank means "the shipped one" — the app treats an empty
      # value as unset, because a compose file forwarding an unset variable sets it
      # to the empty string, and a set-but-empty value outranks every default.
      - ASSISTANT_SANDBOX_IMAGE=${EMBABEL_SANDBOX_IMAGE:-}
      # The key your wallet is encrypted with. The appliance runs `wallet.mode: local`
      # (see application-appliance.yml) — the browser holds the encrypted blob and
      # nothing decryptable rests here — but WITHOUT this the server generates a key
      # per start, so the blob it handed the browser yesterday decrypts to nothing
      # today and the wallet reports itself EMPTY rather than erroring. Every OAuth
      # app and API key silently needed re-entering after each restart.
      #
      # BARE FORM, and unlike OPENAI_API_KEY below: `${VAR:-}` would hand the
      # container an empty wallet key, which is worse than none — an empty key
      # decrypts nothing and silently loses every stored credential, where an
      # absent one makes setup.py generate a real one into .env on first run.
      # OpenAI takes the opposite treatment because its config THROWS on an
      # absent key and merely constructs on an empty one.
      - EMBABEL_KEY_SECRET
      # ${VAR:-}, LIKE ANTHROPIC BELOW, and for the same reason — which cost a
      # developer a broken fresh install to learn. OpenAiModelsConfig reads
      # `envApiKey ?: properties.apiKey ?: error(...)`: an UNSET variable is null
      # and throws in the constructor, crash-looping the whole app, while an
      # EMPTY one is a value and constructs. A server that cannot boot without a
      # key cannot be asked for one — setup drives the server's own /setup steps
      # over HTTP — so the bare form made a genuinely fresh machine unsetuppable.
      #
      # The bare form was there to stop an empty variable SHADOWING the key
      # first-run setup writes into the data volume (env beats config files in
      # Spring). That is still true, and is now handled where it belongs: setup
      # writes the key it collects into .env, so this variable carries a real
      # value from the first boot after setup rather than an empty one. See
      # remember_provider_key in setup.py.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # ANTHROPIC keeps the ${VAR:-} form ON PURPOSE, unlike OPENAI above: the
      # Anthropic auto-config THROWS in its constructor when no key is present
      # ("Anthropic API key required"), which crash-loops the whole app for anyone
      # who only has an OpenAI key — i.e. everyone setup.py serves by default. An
      # empty value constructs, and the appliance's default LLM roles are OpenAI,
      # so nothing routes there unless configured. Remove this workaround when
      # BYOK lands and a missing provider key is simply inert.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Same embedding model as the Me mode, NON-NEGOTIABLY: both modes write
      # vectors into the same graph, and every vector in it has to come from one
      # model. The pin lives in embeddings-local-worlds.yml / -me.yml, which say so.
      #
      # Empty by default, and that is deliberate — an appliance ships with no
      # embedding model and `embabel embeddings use local|openai` chooses one. The
      # long note in docker-compose-me.yml explains why the empty value must stay
      # empty, and why `:-text-embedding-3-small` would be a regression.
      # `hosted`, NOT EMPTY, and that is a decision reversed rather than a typo fixed.
      #
      # The empty value was deliberate: an appliance shipped unable to embed, so passing nothing
      # here beat the image's own default and kept document features off until somebody chose. The
      # premise was that every embedder cost a key or a gigabyte.
      #
      # It no longer does. The image carries all-MiniLM-L6-v2 in process (embabel/me#1556), and
      # the appliance profile maps the `hosted` role to it, so the default now resolves to
      # something that works with no key, no runner and no download. Passing empty here is what
      # stopped that: it overrode the role with nothing, and a fresh appliance sat on the
      # placeholder with ONNX loaded and unreachable.
      #
      # A ROLE rather than a name, for the reason the role exists: it is resolved per call, so a
      # provider key arriving later moves embeddings onto the better model without a restart.
      # THE MODEL BY NAME, not the `hosted` role, and the difference is not cosmetic.
      #
      # A role resolves against whichever provider is ACTIVE, and `embedding-roles.<role>.<provider>`
      # names a model BELONGING TO that provider — so there is no way to say "when this key cannot
      # embed, use the built-in". Pointing anthropic at `all-MiniLM-L6-v2` asks the platform to
      # build MiniLM as an Anthropic model and fails with "Nothing built an embedding service for
      # provider 'anthropic'" — the same error as naming nothing at all. Tried, on a real install.
      #
      # The built-in is registered under its own provider and is always there, so naming it
      # resolves whatever key is or is not present. It does not upgrade itself when a better key
      # arrives, and that is deliberate: switching re-embeds every stored vector, so the upgrade is
      # offered on the Embeddings tab rather than taken on somebody's behalf.
      - EMBABEL_MODELS_DEFAULT_EMBEDDING_MODEL=${ASSISTANT_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      # Models the operator runs on their OWN machine, outside Docker. `localhost`
      # inside this container is the container, so an LM Studio or Ollama server
      # they can see in a browser is invisible here — it must be addressed as the
      # host, which Docker Desktop proxies through host.docker.internal (and the
      # extra_hosts entry below supplies on Linux).
      #
      # The Me door had these and Worlds did not, so the door that sells running
      # your own models was the one that could not reach them. Spelled in full
      # because that is what Spring binds — see the long note in
      # docker-compose-me.yml for what the short names silently failed to do.
      - EMBABEL_AGENT_PLATFORM_MODELS_LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      - EMBABEL_AGENT_PLATFORM_MODELS_OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # DOCKER MODEL RUNNER, named on every boot rather than only when the local
      # embedder overlay is composed in. It was conditional, and that made
      # `embabel embeddings use local` cost a restart for a reason that had nothing
      # to do with the model: the container simply did not know where the runner was
      # until it was recreated with this variable present. The framework's default is
      # `http://localhost:12434/engines` — the CONTAINER's loopback, never the host's —
      # so unset meant "discover nothing", silently, exactly as LM Studio and Ollama
      # did before the note above.
      #
      # `model-runner.docker.internal` rather than `host.docker.internal:12434`:
      # both reach the runner from in here, but the host port exists only when
      # Docker Desktop's host-side TCP is switched on, and this name does not need it.
      # Nothing else is required of an operator — the model itself is pulled on the
      # HOST by `embabel embeddings use local`, outside the composition.
      #
      # Costs nothing where there is no runner. Discovery fails and registers no
      # models, which is the same posture as the two lines above and the reason they
      # are unconditional too.
      # ENDS AT /v1, because the runner's inference paths do.
      #
      # `/engines` can LIST models and 404s on every inference call, which is the worst shape this
      # can take: discovery succeeds, the model is offered in the console, and choosing it fails
      # when something asks the model its dimensions — a live embed call — with
      # `404: Unknown` out of the OpenAI SDK. Verified from inside the container:
      # POST /engines/embeddings is 404 and POST /engines/v1/embeddings is 200.
      #
      # The openai SDK appends bare paths like `/embeddings`, so the version has to be in the base
      # URL; nothing downstream adds it.
      - EMBABEL_AGENT_MODELS_DOCKER_BASE_URL=${DOCKER_MODELS_BASE_URL:-http://model-runner.docker.internal/engines/v1}
      - EMBABEL_MCP_API_TOKEN=${EMBABEL_MCP_API_TOKEN:-}
      # THE CODE DOOR CARRIES THE BUILDING SURFACE NOW, so the primary endpoint
      # goes back to ASSISTANT — the surface for a chat client asking about the
      # world's data. This used to say DEVELOPER, because the primary endpoint was
      # the only door and worlds exists to be built on; with /mcp/code always serving
      # the developer list (and setup wiring coding agents there), leaving the
      # primary on DEVELOPER would show every chat client the realm-mining tools.
      #
      # A user who picks a mode in the console still wins; this only decides where
      # someone who has never touched the switch starts. A request arriving on the
      # code door is DEVELOPER regardless of any of this.
      - ASSISTANT_INFRASTRUCTURE_MCP_DEFAULT_MODE=${WORLDS_MCP_MODE:-ASSISTANT}
      - EMBABEL_MCP_API_TOKEN_USER=${EMBABEL_MCP_API_TOKEN_USER:-}
      - ASSISTANT_DOC_CONVERTER=${ASSISTANT_DOC_CONVERTER:-docling}
      # Docling requests the app keeps in flight: docling's worker count, from the same
      # variable, so windows past it wait in the app rather than inside docling
      # (embabel/me#1730). 2 is docling's own default, for a hand-run compose.
      - ASSISTANT_INFRASTRUCTURE_DOCUMENTPIPELINE_DOCLING_MAXCONCURRENTREQUESTS=${DOCLING_WORKERS:-2}
      # Measured on a 2.79 GiB limit ingesting 28 books at once (#111): at 60% heap the
      # container reached 97% of its limit and stayed there, because G1 never returns
      # committed heap and the JVM keeps ~1 GB outside it. At 45%, with committed heap
      # returned when idle and glibc held to two malloc arenas, it peaked at 58-66%.
      # The live heap after that ingest was ~300 MB, so 45% is still generous.
      - JAVA_OPTS=${JAVA_OPTS:--XX:MaxRAMPercentage=45 -XX:G1PeriodicGCInterval=60000}
      # A JVM out of heap does not exit: it stays up, answers nothing, and the healthcheck
      # marks it unhealthy, which Docker does not act on. Exiting lets `restart:
      # unless-stopped` bring it back. Its own variable, read by the java launcher, so a
      # JAVA_OPTS set in .env cannot drop it.
      - JDK_JAVA_OPTIONS=${JDK_JAVA_OPTIONS:--XX:+ExitOnOutOfMemoryError}
      # Consecutive health checks with no answer at all before the watchdog restarts the
      # app (15 s apart, so 5 is about 75 s); 0 turns it off. See container/health-watchdog.sh.
      - APP_WATCHDOG_FAILURES=${APP_WATCHDOG_FAILURES:-5}
      - MALLOC_ARENA_MAX=${MALLOC_ARENA_MAX:-2}
      # Distinguishes this mode from the Me mode in the usage payload — a constant,
      # not information about you. See PHONE_HOME.md.
      - ASSISTANT_PACKAGING=docker-compose-worlds
      # USAGE REPORTING IS OFF UNLESS THIS APPLIANCE TURNS IT ON. The image defaults
      # this to Embabel's collector; naming it here with an empty default overrides
      # that, and an empty endpoint means the server assembles reports and transmits
      # nothing. Set EMBABEL_PHONE_HOME=true in .env to opt in — setup.py resolves
      # that to the collector address, which lives in this repo and not in the image.
      - ASSISTANT_PHONE_HOME_ENDPOINT=${ASSISTANT_PHONE_HOME_ENDPOINT:-}
      # THE TERMS SETUP ASKS FOR are the Free Trial Terms and Conditions, the copy in
      # this repo, and only those. The image's defaults are the website's terms of use
      # and privacy policy, which are not the agreement the trial runs under; an empty
      # privacy URL leaves that link out. A new version asks everyone to agree again.
      - ASSISTANT_SETUP_TERMS_URL=${ASSISTANT_SETUP_TERMS_URL:-https://github.com/embabel-worlds/appliance/blob/main/TRIAL_TERMS.md}
      - ASSISTANT_SETUP_TERMS_VERSION=${ASSISTANT_SETUP_TERMS_VERSION:-2026-10-13}
      - ASSISTANT_SETUP_PRIVACY_URL=${ASSISTANT_SETUP_PRIVACY_URL:-}
      # ENTITY EXTRACTION OFF BY DEFAULT. Every ingested document otherwise costs
      # an LLM call that asks a model to pull typed entities out of it, and on
      # this appliance it failed on every single one: the model returns a null
      # `properties` and the binder rejects it, three attempts per document,
      # before logging that ingest had already succeeded anyway. Seeding the
      # documentation alone meant 25 documents times 3 failed calls at first run.
      #
      # It is off rather than fixed because the fix is in the dice library and
      # the value is optional: search and retrieval do not use it. Set
      # ASSISTANT_ENTITY_EXTRACTION=true to turn it back on.
      - ASSISTANT_INFRASTRUCTURE_DOCUMENT_PIPELINE_ENTITY_EXTRACTION=${ASSISTANT_ENTITY_EXTRACTION:-false}
      # Without an external organization role provider, this fallback applies to
      # every authenticated principal. Admin by default lets the setup-created
      # operator use admin-gated local surfaces; set `user` to opt out.
      - ORG_ROLE_FALLBACK=${ORG_ROLE_FALLBACK:-admin}
      # World template for NEW worlds — same seam as the me mode; see its file.
      - ASSISTANT_BOOTSTRAP_WORLD
      - BRAVE_API_KEY
      # ALL THREE NAMES the assistant looks for (WorldBootstrap.resolveGitHubToken), because a
      # developer's shell rarely has the first one: `gh` writes GH_TOKEN, and forwarding only
      # GITHUB_TOKEN meant a machine with a perfectly good token still failed to clone a private
      # realm. Bare pass-through, so an unset name stays unset in the container rather than
      # arriving as an empty string the app would have to special-case.
      - GITHUB_TOKEN
      - GH_TOKEN
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - TELEGRAM_BOT_TOKEN
      - SLACK_APP_TOKEN
    volumes:
      # Same socket rationale as the Me mode: sandboxes are host-daemon siblings,
      # and the socket is root-equivalent on the host — a decision, not a surprise.
      - /var/run/docker.sock:/var/run/docker.sock
      # THE SAME worlds-on-disk volume as the Me mode. A world is the unit the
      # whole product family agrees on; the modes are surfaces over it.
      - embabel_assistant_data:/data
      # Realm checkouts on the host, so a realm can be worked on without pushing
      # it: the engine loads a `path:` reference in place, with no clone and no
      # cache entry (`- name: esg` / `path: /realms/realm-esg` in a world's
      # config/realms.yml).
      #
      # Mount the PARENT of your checkouts, not one realm — then adding a realm
      # is a `git clone`, not a compose edit and a restart. EMBABEL_REALMS_DIR in
      # .env points it anywhere; the default is ./realms in this checkout, which
      # exists and is empty so the mount is always valid and inert until used.
      #
      # READ-ONLY, and that is the design rather than a limitation: you edit on
      # the host, where your editor, your coding agent and your git remote
      # already are, and the appliance only ever reads. Wasm handlers still work:
      # build-on-load compiles wasm/handlers.ts in the container and publishes
      # the bundle into the appliance's own storage, never into your checkout.
      # One consequence to know rather than discover — a realm's declared npm
      # build runs inside cloneRepo, so it never fires for a local reference;
      # a realm that needs npm must be built on the host first.
      - ${EMBABEL_REALMS_DIR:-./realms}:/realms:ro
      # Certificate authorities to trust beyond the public ones: a company's own
      # root, for a gateway on an internal address or a network that inspects
      # outbound traffic. The image imports every *.crt here when it starts.
      # Managed with `embabel trust`; see certs/README.md.
      - ./certs:/certificates:ro
      # The healthcheck's watchdog script, read-only: see the service's `healthcheck:`.
      - ./container/health-watchdog.sh:/opt/embabel/health-watchdog.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Console — the Worlds web face ───────────────────────────────────────────
  # Static app + nginx proxying /api to the server on the SAME ORIGIN, so the
  # browser's login applies with no CORS and no token plumbing. Ships as an image
  # like everything else: no checkout, no Node, no dev server.
  # PUBLISHED FROM embabel-worlds, unlike the assistant images: the console's repo
  # lives in that org, and GITHUB_TOKEN can only push to packages linked to its own
  # repository — the same lesson mirror-docling records, which is why docling sits
  # in that namespace too. Its CI could not publish at all until this moved.
  worlds-console:
    image: ghcr.io/embabel-worlds/worlds-console:${EMBABEL_VERSION:-latest}
    logging: *logging
    restart: unless-stopped
    depends_on:
      - worlds
    ports:
      - "127.0.0.1:${WORLDS_CONSOLE_PORT:-11044}:80"
    environment:
      # In-container address of the server: same compose network, container port.
      - WORLDS_URL=http://worlds:${WORLDS_PORT:-11043}
      # OPTIONAL: skip the console's sign-in by having the proxy authenticate for
      # you. Convenient on your own laptop; understand what it means before setting
      # it — ANYONE who can reach the console port is then this user, and it acts as
      # them (chat, memory, document ingest). Empty by default: the console asks.
      - WORLDS_CONSOLE_USER=${WORLDS_CONSOLE_USER:-}
      - WORLDS_CONSOLE_PASSWORD=${WORLDS_CONSOLE_PASSWORD:-}
    volumes:
      # THE GUIDES, FOR SETUP TO PUT INTO THE NEW WORLD. A world starts empty, so the
      # first question anybody has — what is this, and what can I ask it — was one it
      # could not answer about itself. The terminal installer uploaded these files
      # itself (embabel_setup/seed.py); setup that finishes in the browser cannot,
      # because a page cannot read this checkout. So the console is handed them:
      # nginx lists /guides/ and the last step of setup ingests what it finds.
      #
      # FROM THE CHECKOUT, NOT BAKED INTO THE IMAGE, so a world is told about the
      # appliance that is installed rather than the one the console was built beside.
      #
      # The same set seed.py names, and for its reasons: CONTRIBUTING, CLAUDE.md and
      # AGENT_GUIDE.md are instructions to people and agents working ON or WITH an
      # appliance, and somebody searching their world should not get them back.
      #
      # Read-only. The top four are single-file mounts, which pin the file as it was
      # when the container started — an upgrade recreates the container, so that is
      # the version that should be served.
      - ./README.md:/usr/share/nginx/guides/README.md:ro
      - ./CLI.md:/usr/share/nginx/guides/CLI.md:ro
      - ./PHONE_HOME.md:/usr/share/nginx/guides/PHONE_HOME.md:ro
      - ./WORLD_TEMPLATES.md:/usr/share/nginx/guides/WORLD_TEMPLATES.md:ro
      - ./docs/guide:/usr/share/nginx/guides/guide:ro
      - ./skills:/usr/share/nginx/guides/skills:ro

  # ── SQL endpoint (opt-in) ────────────────────────────────────────────────────
  # A Postgres-wire surface onto the world, so BI tools, dbt and notebooks can query
  # it as tables — Metabase, Grafana, DuckDB, psql, even another Postgres via
  # postgres_fdw. OFF by default: it starts only under the `world-sql` compose
  # profile, which the installer turns on for `--sql` (setup.py → dockerlib.compose_env
  # sets COMPOSE_PROFILES). A plain `docker compose up` never starts it. PUBLISHED
  # FROM embabel-worlds, like the console — pinned separately from EMBABEL_VERSION
  # because world-sql versions on its own repo.
  #
  # It holds NO credentials. A client's own username and password are forwarded per
  # connection and authenticated against the appliance, so a connection sees exactly
  # that user's scope — multi-tenant for free, and nothing here is a second identity.
  world-sql:
    image: ghcr.io/embabel-worlds/world-sql:${WORLD_SQL_VERSION:-latest}
    logging: *logging
    profiles: ["world-sql"]
    restart: unless-stopped
    depends_on:
      - worlds
    ports:
      - "127.0.0.1:${WORLDS_SQL_PORT:-15432}:15432"
    environment:
      # In-container address of the server: same compose network, container port.
      - APPLIANCE_BASE=http://worlds:${WORLDS_PORT:-11043}
      # Bind every interface INSIDE the container; what is exposed is the ports:
      # line above. The image already defaults to this — explicit is clearer.
      - WORLDSQL_BIND=0.0.0.0
