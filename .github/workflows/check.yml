name: Check

# Every push and pull request. The installer is Python standard library and shell, so
# the gates are the ones the repository already keeps for itself: every module compiles,
# every check script under scripts/ passes (each is a regression somebody actually hit),
# the command answers, and the Me app typechecks and builds. Nothing here needs Docker
# or an appliance; the install itself is driven by scripts/drive-install.py by a person.

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every module compiles
        run: python3 -m compileall -q embabel_setup scripts *.py
      - name: The command answers
        run: ./embabel --help > /dev/null && ./embabel version --help > /dev/null
      - name: Copy, modules, timeouts, agents, shim, ports, instances, tokens, embeddings, memory, trust, health checks, installer parity, trial terms
        run: |
          for check in check-copy check-modules check-complete check-agents check-shim check-port-allocation check-compose-project check-uninstall-token check-embeddings-role check-memory-sizing check-trust check-healthcheck-env check-installer-parity check-trial-terms check-guides; do
            echo "== $check"
            python3 "scripts/$check.py"
          done

  # The Me app takes @embabel/appliance-kit from that repository's main, pinned to a
  # commit by the lockfile. A developer's node_modules is usually a link to a live kit
  # checkout, which never notices when the pin falls behind — this job is what does.
  # When it fails on a missing kit export, refresh the pin:
  #   cd me-app && npm install --package-lock-only @embabel/appliance-kit@github:embabel-worlds/appliance-kit#main
  me-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: me-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: me-app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
