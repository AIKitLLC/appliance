name: Installer

# The two one-command installers, on the machines they are actually piped into.
#
# check.yml covers what the repo can prove by reading itself. This covers what
# install.sh and install.ps1 DO: every refusal a person can hit, and the whole
# way through to the hand-off. Both harnesses stub Docker and Python rather than
# needing either, which is what makes this a per-PR gate instead of a nightly.
#
# WHAT IS DELIBERATELY NOT HERE: starting the appliance. A GitHub-hosted windows
# runner has no Docker Desktop and cannot run Linux containers at all, and a
# real first install pulls ~15GB and takes minutes. That belongs on a machine
# with Docker, nightly — not in front of a pull request.
#
# THE POSIX MATRIX IS SHELLS, NOT RUNNERS. install.sh is #!/bin/sh: dash on
# Debian, busybox ash on Alpine. A bashism is invisible on ubuntu-latest, whose
# /bin/sh is dash but whose everything-else is not, so the scenarios run inside
# four distro images. Note `docker run` rather than `container:` — the runner's
# bundled node is glibc-only, so actions/checkout cannot run inside Alpine; the
# checkout stays on the host and the image gets the source mounted.

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  # WEEKLY, because every scenario leans on something outside this repository:
  # codeload's tarball, four distro images and their package mirrors, and the
  # runner images themselves — a `windows-latest` that moves docker.exe again is
  # exactly the bug this suite shipped with. A push-only gate notices none of
  # that until somebody happens to push. Monday 04:37 UTC, off the hour to dodge
  # the scheduler pileup, and on the full lane because `all` is what a
  # non-pull_request event gets.
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

concurrency:
  group: installer-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The ref the network scenarios download. A PR tests ITS OWN head, so a change
  # that breaks the tarball fails here rather than after the merge. A fork's head
  # is not in this repository, so those runs stay on the offline lane — the
  # refusals are the part most likely to be edited anyway.
  LANE: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'all' || 'offline' }}
  EMBABEL_TEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Bashisms, unquoted expansions and the `local` that works everywhere except
  # the one shell somebody runs. Cheap, and it reads the harness too: a test
  # written with bash in mind would pass on ubuntu and fail on Alpine.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --severity=warning, not the default: at info level shellcheck reports
      # style preferences (SC2015 on `A && B || C`, SC2086 on words that cannot
      # split, SC2016 on single quotes that are single-quoted deliberately) and a
      # gate that fails on taste gets switched off. Warnings and errors are the
      # things that bite.
      - name: shellcheck, as POSIX sh
        run: shellcheck --severity=warning -s sh install.sh doctor.sh scripts/drive-install-sh.sh
      # The workflow files themselves, because YAML that parses can still be a
      # workflow that cannot start: `shell: ${{ matrix.host }}` is valid YAML and
      # an invalid workflow, and GitHub reports that as a run with no jobs, no
      # logs and no annotation reachable from the API. Caught locally in seconds
      # by the same image.
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:latest -shellcheck= -pyflakes=

  posix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # curl and tar are what install.sh assumes of the machine. Installing
          # them here says that out loud: the image is the SHELL under test, not
          # a claim that a bare image can run the installer.
          - image: ubuntu:24.04
            deps: apt-get update -qq && apt-get install -y -qq curl ca-certificates tar
          - image: debian:12
            deps: apt-get update -qq && apt-get install -y -qq curl ca-certificates tar
          - image: alpine:3.21   # /bin/sh is busybox ash
            deps: apk add --no-cache curl tar
          - image: fedora:41
            deps: dnf install -y -q curl tar
    steps:
      - uses: actions/checkout@v4
      - name: Scenarios on ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e EMBABEL_TEST_REF="$EMBABEL_TEST_REF" \
            ${{ matrix.image }} \
            sh -c '${{ matrix.deps }} >/dev/null 2>&1 && sh scripts/drive-install-sh.sh '"$LANE"

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.1 is what a stranger pipes `irm | iex` into and is the host
        # install.ps1's TLS 1.2, -UseBasicParsing and ASCII-only rules exist
        # for; 7 is what a developer has. They are different enough to run both.
        host: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      # `shell:` CANNOT take the matrix context — it is resolved before any
      # context exists — so the host is invoked from the run line instead, where
      # matrix is available. The harness re-launches whichever host is running
      # it, so `powershell` here means every scenario executes under 5.1.
      - name: Scenarios under ${{ matrix.host }}
        shell: pwsh
        run: '& ${{ matrix.host }} -NoProfile -File ./scripts/drive-install-ps1.ps1 -Which $env:LANE'

  # ONE STABLE NAME to require as a status check. The matrix job names carry
  # their parameters — "posix (debian:12, apt-get update -qq && …)" — so
  # requiring them directly means a protection rule that silently orphans itself
  # the next time a package list is edited, leaving a branch guarded by a check
  # that can no longer run.
  #
  # `if: always()` with the results read EXPLICITLY, because a required check
  # that is SKIPPED counts as satisfied: plain `needs` would skip this job when
  # anything upstream failed, and the merge button would go green on a red
  # matrix. Failing loudly is the whole job.
  gate:
    needs: [lint, posix, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every installer job passed
        env:
          RESULTS: lint=${{ needs.lint.result }} posix=${{ needs.posix.result }} windows=${{ needs.windows.result }}
        run: |
          echo "$RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*) echo "::error::the installer suite did not pass"; exit 1 ;;
          esac
